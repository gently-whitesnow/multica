name: Publish Whitesnow images v0.4.17

on:
  workflow_dispatch:
  push:
    tags:
      # Bootstrap trigger: workflow_dispatch becomes available only after this
      # workflow reaches the default branch.
      - "images-v0.4.17"

concurrency:
  group: whitesnow-images-v0.4.17
  cancel-in-progress: false

permissions:
  contents: read

env:
  SOURCE_REVISION: aa201cd6150a97bd5706b6cfb3333849aa840dcf
  SOURCE_URL: https://github.com/gently-whitesnow/multica
  SOURCE_DATE: "2026-08-02T12:29:27Z"
  VERSION: v0.4.17

jobs:
  publish:
    if: >-
      github.repository == 'gently-whitesnow/multica' &&
      (github.event_name == 'workflow_dispatch' || github.ref == 'refs/tags/images-v0.4.17')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            image: ghcr.io/gently-whitesnow/multica-backend
            dockerfile: Dockerfile
            title: Multica Backend
            description: Multica self-hosted backend
            build_args: |
              VERSION=v0.4.17
              COMMIT=aa201cd6150a97bd5706b6cfb3333849aa840dcf
              DATE=2026-08-02T12:29:27Z
          - component: web
            image: ghcr.io/gently-whitesnow/multica-web
            dockerfile: Dockerfile.web
            title: Multica Web
            description: Multica self-hosted web frontend
            build_args: |
              NEXT_PUBLIC_APP_VERSION=v0.4.17
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.SOURCE_REVISION }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify source revision
        shell: bash
        run: |
          set -euo pipefail
          actual_revision="$(git rev-parse HEAD)"
          if [[ "$actual_revision" != "$SOURCE_REVISION" ]]; then
            echo "::error::Expected $SOURCE_REVISION, checked out $actual_revision"
            exit 1
          fi

      - name: Compute OCI metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=${{ env.VERSION }}
            type=raw,value=sha-${{ env.SOURCE_REVISION }}
          labels: |
            org.opencontainers.image.title=${{ matrix.title }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.source=${{ env.SOURCE_URL }}
            org.opencontainers.image.revision=${{ env.SOURCE_REVISION }}
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.created=${{ env.SOURCE_DATE }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish ${{ matrix.component }}
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.build_args }}
          provenance: mode=max

      - name: Inspect immutable manifest and record digest
        env:
          IMAGE_REF: ${{ matrix.image }}@${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          docker manifest inspect "$IMAGE_REF"
          docker buildx imagetools inspect "$IMAGE_REF"
          {
            echo "### ${{ matrix.title }}"
            echo
            echo "\`$IMAGE_REF\`"
            echo
            echo "Source: \`$SOURCE_REVISION\`; version: \`$VERSION\`."
          } >> "$GITHUB_STEP_SUMMARY"
